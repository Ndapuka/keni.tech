<button type="button" class="theme-toggle" (click)="themeService.toggle()"
    [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'">
    <span class="toggle-track" [class.is-light]="themeService.theme() === 'light'">
        <span class="toggle-thumb">
            @if (themeService.theme() === 'dark') {
            <!-- ícone lua -->
            <svg viewBox="0 0 24 24" fill="none" width="12" height="12">
                <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" fill="currentColor" />
            </svg>
            } @else {
            <!-- ícone sol -->
            <svg viewBox="0 0 24 24" fill="none" width="12" height="12">
                <circle cx="12" cy="12" r="4" fill="currentColor" />
                <path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            }
        </span>
    </span>
</button>
