<!-- features/auth/components/forgot-password/forgot-password.html -->
<!-- features/auth/components/forgot-password/forgot-password.html -->
<div class="auth-card">

    <ng-container *ngIf="!showMessage(); else successTemplate">

        <h2 class="auth-title">Recuperar Password</h2>
        <p class="auth-subtitle">Introduza o email associado à sua conta.</p>

        <form class="auth-form" [formGroup]="forgotPasswordForm" (ngSubmit)="sendRecoveryEmail()">

            <div class="auth-field">
                <label for="forgot-email" class="auth-label">Email</label>
                <input id="forgot-email" type="email" class="auth-input"
                    [class.has-error]="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched"
                    formControlName="email" placeholder="teu@email.com" />
            </div>

            <button type="submit" class="auth-btn-primary" [disabled]="isSubmitting()">
                {{ isSubmitting() ? 'A enviar...' : 'Enviar Email' }}
            </button>

        </form>

        <p class="auth-footer-text">
            <button type="button" class="auth-btn-link" (click)="backToLogin()">Voltar ao Login</button>
        </p>

    </ng-container>

    <ng-template #successTemplate>
        <app-auth-message [icon]="isError() ? '✕' : '✉'" [title]="messageTitle()" [message]="messageText()"
            buttonText="Voltar ao Login" (buttonClick)="backToLogin()">
        </app-auth-message>
    </ng-template>

</div>
