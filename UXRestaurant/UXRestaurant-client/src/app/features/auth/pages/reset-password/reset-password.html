<!-- features/auth/pages/reset-password/reset-password.html -->
<div class="auth-page">
    <div class="auth-card" style="max-width: 420px;">

        <!-- features/auth/pages/reset-password/reset-password.html -->
        @if (tokenMissing) {
        <app-auth-message icon="✕" title="Link inválido" message="Não encontrámos um token de redefinição neste link."
            buttonText="Voltar ao início" (buttonClick)="goToLogin()">
        </app-auth-message>
        }
        @else if (showMessage) {
        <app-auth-message [icon]="isError ? '✕' : '✔'" [title]="messageTitle" [message]="messageText"
            buttonText="Ir para Login" (buttonClick)="goToLogin()">
        </app-auth-message>
        } @else {
        <h2 class="auth-title">Redefinir password</h2>

        <form class="auth-form" [formGroup]="resetForm" (ngSubmit)="submit()">

            <div class="auth-field">
                <label for="new-password" class="auth-label">Nova password</label>
                <input id="new-password" type="password" class="auth-input" formControlName="newPassword"
                    autocomplete="new-password" />
                @if (resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched) {
                <span class="auth-field-error">Mínimo de 6 caracteres.</span>
                }
            </div>

            <div class="auth-field">
                <label for="confirm-password" class="auth-label">Confirmar password</label>
                <input id="confirm-password" type="password" class="auth-input" formControlName="confirmPassword"
                    autocomplete="new-password" />
                @if (resetForm.get('confirmPassword')?.hasError('mismatch')) {
                <span class="auth-field-error">As passwords não coincidem.</span>
                }
            </div>

            <button type="submit" class="auth-btn-primary" [disabled]="isSubmitting">
                {{ isSubmitting ? 'A redefinir...' : 'Redefinir password' }}
            </button>

        </form>
        }

    </div>
</div>
